# Aplica las migraciones de la base de datos en Supabase.
# Requiere el secreto SUPABASE_DB_URL (Settings → Secrets and variables → Actions):
# la cadena de conexión "Session pooler" del proyecto Supabase, con la contraseña.
name: Aplicar migraciones de base de datos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]

concurrency:
  group: migraciones
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar el secreto
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL en Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Aplicar migraciones
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./scripts/apply-migrations.sh
